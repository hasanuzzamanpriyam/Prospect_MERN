<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo/Favicon.png" id="dynamic-favicon" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Comprehensive B2B prospect intelligence platform with advanced search, team collaboration, and payment integrations." />
  <meta name="keywords" content="B2B, prospect, intelligence, sales, leads, contacts" />
  <title id="dynamic-title">PROSPCT - B2B Prospect Intelligence Platform</title>

  <!-- Open Graph / Social Media Meta Tags -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="PROSPCT" id="og-site-name" />
  <meta property="og:title" content="PROSPCT - B2B Prospect Intelligence Platform" id="og-title" />
  <meta property="og:description" content="Comprehensive B2B prospect intelligence platform with advanced search, team collaboration, and payment integrations." id="og-description" />
  <meta property="og:image" content="/images/og-image.png" id="og-image" />
  <meta property="og:url" content="https://app.prospct.io" id="og-url" />

  <!-- Twitter Card Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@prospct" id="twitter-site" />
  <meta name="twitter:title" content="PROSPCT - B2B Prospect Intelligence Platform" id="twitter-title" />
  <meta name="twitter:description" content="Comprehensive B2B prospect intelligence platform with advanced search, team collaboration, and payment integrations." id="twitter-description" />
  <meta name="twitter:image" content="/images/og-image.png" id="twitter-image" />

  <!-- Theme Color -->
  <meta name="theme-color" content="#7c3aed" id="theme-color" />

  <!-- FastSpring SBL (Storefront Builder Library) -->
  <script id="fsc-api" src="https://sbl.onfastspring.com/sbl/1.0.6/fastspring-builder.min.js" type="text/javascript"
    data-storefront="prospct.onfastspring.com" data-access-key="U46CRMFZROOYBDPE-XUBUW"
    data-data-callback="dataCallback" data-error-callback="fsErrorCallback" data-popup-closed="onFSPopupClosed"
    data-continuous="true">
    </script>

  <!-- FastSpring Global Callbacks (must be defined before React mounts) -->
  <script>
    window.dataCallback = function (data) {
      if (data.totalValue > 0) {
      } else {
        console.warn("[FastSpring] ✗ Session empty - check product paths");
      }
    };
    window.fsErrorCallback = function (code, url) {
      console.error("[FastSpring] SBL error:", code, url);
    };
    window.onFSPopupClosed = function (orderRef) {
      if (orderRef?.id) window.location.replace("/dashboard");
    };
  </script>

  <!-- Theme initialization (must run before React to prevent flash) -->
  <script>
    (function() {
      var savedTheme = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var isDark = savedTheme === 'dark' || (!savedTheme && prefersDark);
      
      if (isDark) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>

<body class="transition-colors duration-0">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
